<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#64b990" />
  <title>뮤트 운영센터 · 신고 관리</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:light;--ink:#17211d;--sub:#6f7d76;--line:#e5ece8;--paper:#fff;--bg:#f2f7f4;--mint:#5dbb8c;--mint-deep:#338d67;--blue:#82b9c1;--red:#df5a73;--amber:#e9a23b;--shadow:0 16px 45px rgba(28,76,57,.09)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(130,185,193,.17),transparent 28rem),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;line-height:1.5}
    button,input{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.top{position:sticky;top:0;z-index:20;color:#fff;background:linear-gradient(112deg,#82b9c1 0%,#5dbb8c 72%,#4aaa7d 100%);box-shadow:0 10px 32px rgba(45,130,94,.18)}
    .top-in{max-width:1180px;margin:auto;min-height:78px;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:900;font-size:21px;border:1px solid rgba(255,255,255,.3)}
    h1{margin:0;font-size:20px;letter-spacing:-.03em}.top small{display:block;color:rgba(255,255,255,.78);margin-top:1px}.session{display:flex;align-items:center;gap:9px;font-size:13px}.session-dot{width:8px;height:8px;border-radius:99px;background:#d9ffe9;box-shadow:0 0 0 5px rgba(255,255,255,.13)}
    main{max-width:1180px;margin:0 auto;padding:26px 22px 64px}.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.login-wrap{min-height:calc(100vh - 150px);display:grid;place-items:center}.login{width:min(440px,100%);padding:30px}.login-mark{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;margin-bottom:20px;color:#fff;font-size:25px;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--mint))}.login h2{margin:0 0 7px;font-size:25px}.muted{color:var(--sub);font-size:13px}.field{display:block;margin-top:18px}.field span{display:block;font-size:13px;font-weight:750;margin:0 0 7px}.field input,.search{width:100%;height:48px;border:1px solid #dce6e1;border-radius:14px;background:#fbfdfc;padding:0 14px;color:var(--ink);outline:none;transition:.2s}.field input:focus,.search:focus{border-color:var(--mint);box-shadow:0 0 0 4px rgba(93,187,140,.12);background:#fff}
    .btn{border:0;border-radius:13px;min-height:42px;padding:0 15px;font-weight:760;color:#46534d;background:#edf2ef;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:wait}.btn-primary{color:#fff;background:linear-gradient(100deg,var(--blue),var(--mint))}.btn-danger{color:#a93b50;background:#fff0f3}.btn-ghost{color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25)}.login .btn-primary{width:100%;height:50px;margin-top:22px}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:2px 0 18px}.hero h2{margin:0;font-size:27px;letter-spacing:-.04em}.hero p{margin:5px 0 0}.tools{display:flex;gap:9px;align-items:center}.tools .btn{background:#fff;border:1px solid var(--line)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:17px 18px;background:#fff;border:1px solid var(--line);border-radius:18px}.stat-label{font-size:12px;color:var(--sub);font-weight:700}.stat-value{font-size:27px;font-weight:850;margin-top:2px;letter-spacing:-.03em}.stat:nth-child(1) .stat-value{color:var(--mint-deep)}.stat:nth-child(3) .stat-value{color:var(--red)}
    .filterbar{padding:14px;margin-bottom:16px}.filter-top{display:grid;grid-template-columns:minmax(230px,1fr) auto;gap:12px}.search-wrap{position:relative}.search{padding-left:42px}.search-icon{position:absolute;left:15px;top:13px;color:#8c9992}.tabs{display:flex;gap:7px;overflow:auto;padding:13px 0 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:999px;min-height:36px;padding:0 13px;background:#fff;color:#607068;font-weight:750;font-size:13px}.tab.active{border-color:transparent;color:#fff;background:var(--mint-deep)}
    .list{display:grid;gap:13px}.report{padding:19px 20px;box-shadow:none;transition:.2s}.report:hover{box-shadow:var(--shadow);border-color:#d8e5de}.report-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.report-title{display:flex;gap:12px;min-width:0}.type-icon{flex:0 0 42px;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#eef8f3;font-size:19px}.report h3{font-size:17px;margin:0;word-break:break-word}.time{color:#8a9790;font-size:12px;margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:#f1f5f3;color:#65736c;font-size:11px;font-weight:800}.badge.received{background:#fff4df;color:#a46b17}.badge.triaged{background:#eaf5ff;color:#397ba9}.badge.actioned{background:#e9f8f0;color:#287b58}.badge.dismissed{background:#f0f1f1;color:#747c78}.badge.hot{background:#fff0f3;color:#c83f5a}
    .reason{margin:15px 0 6px;font-weight:800}.detail{margin:0;white-space:pre-wrap;word-break:break-word;color:#46534d}.ids{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.idbox{padding:12px 13px;border-radius:15px;background:#f8fbf9;border:1px solid var(--line);min-width:0}.id-label{font-size:11px;color:var(--sub);font-weight:800;margin-bottom:5px}.id-line{display:flex;align-items:center;gap:8px}.mono{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.copy{border:0;background:#e8f4ee;color:var(--mint-deep);border-radius:9px;padding:5px 8px;font-size:11px;font-weight:800}.identity{font-size:12px;color:var(--sub);margin-top:3px;overflow-wrap:anywhere}
    details{margin-top:11px;border:1px solid var(--line);border-radius:14px;background:#fbfdfc}summary{padding:11px 13px;cursor:pointer;font-size:12px;font-weight:800;color:#5c6b64}pre{margin:0;padding:0 13px 13px;white-space:pre-wrap;word-break:break-word;color:#536159;font-size:11px;max-height:230px;overflow:auto}.mail{font-size:11px;color:#8a9790;margin-top:11px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.actions .active-status{box-shadow:inset 0 0 0 2px rgba(51,141,103,.22)}
    .empty{padding:64px 20px;text-align:center;color:var(--sub);background:#fff;border:1px dashed #d6e2dc;border-radius:20px}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.spinner{width:28px;height:28px;border:3px solid #dcebe4;border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:24px;z-index:50;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1f2c26;color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
    [hidden]{display:none!important}@media(max-width:760px){.top-in{min-height:70px;padding:12px 15px}.session span:not(.session-dot){display:none}main{padding:19px 13px 45px}.hero{align-items:flex-start}.hero h2{font-size:23px}.stats{grid-template-columns:1fr 1fr}.filter-top{grid-template-columns:1fr}.ids{grid-template-columns:1fr}.report{padding:16px}.report-head{display:block}.badges{justify-content:flex-start;margin:10px 0 0 54px}.tools .btn span{display:none}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="top-in"><div class="brand"><div class="logo">M</div><div><h1>뮤트 운영센터</h1><small>신고 검토 대시보드</small></div></div><div class="session"><span class="session-dot"></span><span id="session">관리자 로그인이 필요합니다</span><button id="logoutButton" class="btn btn-ghost" hidden>로그아웃</button></div></div></header>
  <main>
    <section id="login" class="login-wrap"><div class="card login"><div class="login-mark">M</div><h2>관리자 로그인</h2><p class="muted">슈퍼 관리자 계정으로 신고 내역을 안전하게 확인하세요.</p><label class="field"><span>관리자 아이디 또는 이메일</span><input id="email" autocomplete="username" placeholder="admin 또는 admin@example.com" /></label><label class="field"><span>비밀번호</span><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" /></label><button class="btn btn-primary" id="loginButton">로그인</button><p id="loginError" class="muted" role="alert"></p></div></section>
    <section id="app" hidden><div class="hero"><div><h2>신고 관리</h2><p class="muted">신고 대상과 UID를 확인하고 처리 상태를 기록합니다.</p></div><div class="tools"><button id="refreshButton" class="btn">↻ <span>새로고침</span></button></div></div>
      <div class="stats"><div class="stat"><div class="stat-label">현재 목록</div><div id="statTotal" class="stat-value">0</div></div><div class="stat"><div class="stat-label">접수·검토 중</div><div id="statOpen" class="stat-value">0</div></div><div class="stat"><div class="stat-label">높은 우선순위</div><div id="statHot" class="stat-value">0</div></div><div class="stat"><div class="stat-label">마지막 동기화</div><div id="statTime" class="stat-value" style="font-size:18px">-</div></div></div>
      <div class="card filterbar"><div class="filter-top"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" placeholder="UID, 사유, 내용, 방·사용자 정보 검색" /></div><div class="muted" id="autoRefresh">20초마다 자동 갱신</div></div><div class="tabs"><button data-status="open" class="tab active">미처리</button><button data-status="received" class="tab">접수</button><button data-status="triaged" class="tab">검토 중</button><button data-status="actioned" class="tab">조치 완료</button><button data-status="dismissed" class="tab">기각</button><button data-status="all" class="tab">전체</button></div></div>
      <div id="list" class="empty"><div class="spinner"></div>신고 내역을 불러오는 중입니다.</div>
    </section>
  </main>
</div><div id="toast" class="toast"></div>
<script>
const CONFIG={"supabaseUrl":"https://oxanqrmkvyniocxwreia.supabase.co","anonKey":"sb_publishable_XIfaGWAgJsDH62x1hzhPTQ_FF9TG0nB"};
const client=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.anonKey);
const api=CONFIG.supabaseUrl+"/functions/v1/admin-reports";
let currentStatus="open",allReports=[],refreshTimer=null;
const $=(id)=>document.getElementById(id);
const esc=(value)=>String(value==null||value===""?"-":value).replace(/[&<>"']/g,(ch)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const raw=(value)=>value==null||value===""?"-":String(value);
const formatDate=(value)=>value?new Date(value).toLocaleString("ko-KR",{dateStyle:"medium",timeStyle:"short"}):"-";
const statusLabel={received:"접수",triaged:"검토 중",actioned:"조치 완료",dismissed:"기각"};
const reasonLabel={sexual_content:"성적 콘텐츠",minor_safety:"아동·청소년 안전",harassment:"괴롭힘",hate:"혐오",violence:"폭력",self_harm:"자해",illegal_activity:"불법 활동",privacy:"개인정보",spam:"스팸",impersonation:"사칭",other:"기타"};
const typeLabel={room:"방",user:"사용자",message:"메시지",story:"스토리",comment:"댓글"};
const typeIcon={room:"⌂",user:"●",message:"✉",story:"▤",comment:"◌"};
function targetTitle(report){const t=report.target||{};if(report.target_type==="room")return t.name||"삭제되었거나 찾을 수 없는 방";if(report.target_type==="message")return t.body||t.kind||"삭제되었거나 찾을 수 없는 메시지";if(report.target_type==="story")return t.title||"삭제되었거나 찾을 수 없는 스토리";if(report.target_type==="comment")return t.body||"삭제되었거나 찾을 수 없는 댓글";return t.email||t.phone||"사용자"}
function showToast(message){$("toast").textContent=message;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1600)}
async function copyText(value){try{await navigator.clipboard.writeText(value);showToast("UID를 복사했습니다.")}catch{showToast("복사하지 못했습니다.")}}
async function token(){const {data}=await client.auth.getSession();return data.session?.access_token}
async function request(path,options={}){const accessToken=await token();if(!accessToken)throw new Error("로그인이 필요합니다.");const response=await fetch(api+path,{...options,headers:{"content-type":"application/json",authorization:"Bearer "+accessToken,...(options.headers||{})}});const payload=await response.json().catch(()=>({}));if(!response.ok||payload.error)throw new Error(payload.error==="ADMIN_ONLY"?"슈퍼 관리자 권한이 없습니다.":payload.error||"요청에 실패했습니다.");return payload}
function updateStats(reports){$("statTotal").textContent=reports.length;$("statOpen").textContent=reports.filter(r=>r.status==="received"||r.status==="triaged").length;$("statHot").textContent=reports.filter(r=>Number(r.priority||0)>=5).length;$("statTime").textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function reportCard(report){const reporter=report.reporter||{},target=report.target||{},status=raw(report.status);const hot=Number(report.priority||0)>=5;return '<article class="card report"><div class="report-head"><div class="report-title"><div class="type-icon">'+esc(typeIcon[report.target_type]||"!")+'</div><div><h3>'+esc(targetTitle(report))+'</h3><div class="time">'+esc(formatDate(report.created_at))+' · 신고 ID '+esc(report.id.slice(0,8))+'</div></div></div><div class="badges"><span class="badge '+esc(status)+'">'+esc(statusLabel[status]||status)+'</span><span class="badge">'+esc(typeLabel[report.target_type]||report.target_type)+'</span>'+(hot?'<span class="badge hot">우선순위 '+esc(report.priority)+'</span>':'')+'</div></div><div class="reason">'+esc(reasonLabel[report.reason]||report.reason||"사유 없음")+'</div><p class="detail">'+esc(report.detail||"상세 내용이 없습니다.")+'</p><div class="ids"><div class="idbox"><div class="id-label">신고자 UID</div><div class="id-line"><span class="mono" title="'+esc(report.reporter_user_id)+'">'+esc(report.reporter_user_id)+'</span><button class="copy" data-copy="'+esc(report.reporter_user_id)+'">복사</button></div><div class="identity">'+esc(reporter.email||reporter.phone||"연락처 없음")+'</div></div><div class="idbox"><div class="id-label">신고 대상 UID</div><div class="id-line"><span class="mono" title="'+esc(report.target_id)+'">'+esc(report.target_id)+'</span><button class="copy" data-copy="'+esc(report.target_id)+'">복사</button></div><div class="identity">'+esc(typeLabel[report.target_type]||report.target_type)+'</div></div></div><details><summary>대상 원본 데이터 보기</summary><pre>'+esc(JSON.stringify(target,null,2))+'</pre></details><details><summary>증거 데이터 보기</summary><pre>'+esc(JSON.stringify(report.evidence||{},null,2))+'</pre></details><div class="mail">신고 알림 메일: '+esc(formatDate(report.email_sent_at))+(report.email_failure_reason?' · 실패 '+esc(report.email_failure_reason):'')+'</div><div class="actions"><button class="btn '+(status==="received"?'active-status':'')+'" data-report="'+esc(report.id)+'" data-next="received">접수</button><button class="btn '+(status==="triaged"?'active-status':'')+'" data-report="'+esc(report.id)+'" data-next="triaged">검토 중</button><button class="btn btn-primary '+(status==="actioned"?'active-status':'')+'" data-report="'+esc(report.id)+'" data-next="actioned">조치 완료</button><button class="btn btn-danger '+(status==="dismissed"?'active-status':'')+'" data-report="'+esc(report.id)+'" data-next="dismissed">기각</button></div></article>'}
function render(){const query=$("search").value.trim().toLowerCase();const reports=query?allReports.filter(r=>JSON.stringify(r).toLowerCase().includes(query)):allReports;updateStats(reports);if(!reports.length){$("list").className="empty";$("list").innerHTML="<strong>표시할 신고가 없습니다.</strong>검색어나 상태 필터를 바꿔보세요.";return}$("list").className="list";$("list").innerHTML=reports.map(reportCard).join("");document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>copyText(b.dataset.copy)));document.querySelectorAll("[data-report]").forEach(b=>b.addEventListener("click",()=>setStatus(b.dataset.report,b.dataset.next)))}
async function load(silent=false){if(!silent){$("list").className="empty";$("list").innerHTML='<div class="spinner"></div>신고 내역을 불러오는 중입니다.'}try{const payload=await request("/api/reports?status="+encodeURIComponent(currentStatus));allReports=payload.reports||[];render()}catch(error){$("list").className="empty";$("list").innerHTML="<strong>신고 내역을 불러오지 못했습니다.</strong>"+esc(error.message||"잠시 후 다시 시도해주세요.")}}
async function setStatus(id,status){if(!confirm('상태를 "'+(statusLabel[status]||status)+'"(으)로 변경할까요?'))return;try{await request("/api/reports/status",{method:"POST",body:JSON.stringify({id,status})});showToast("처리 상태를 저장했습니다.");await load(true)}catch(error){alert(error.message||"상태 변경에 실패했습니다.")}}
function startRefresh(){clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(!document.hidden)load(true)},20000)}
function showApp(email){$("login").hidden=true;$("app").hidden=false;$("logoutButton").hidden=false;$("session").textContent=email||"관리자 로그인됨";startRefresh();load()}
document.querySelectorAll("[data-status]").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("[data-status]").forEach(item=>item.classList.remove("active"));button.classList.add("active");currentStatus=button.dataset.status;load()}));
$("search").addEventListener("input",render);$("refreshButton").addEventListener("click",()=>load());$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginButton").click()});
$("loginButton").addEventListener("click",async()=>{const button=$("loginButton");button.disabled=true;$("loginError").textContent="";try{const id=$("email").value.trim(),password=$("password").value,email=id.includes("@")?id:id+"@admin.mute.app";const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;showApp(email)}catch(error){$("loginError").textContent=error.message||"로그인에 실패했습니다."}finally{button.disabled=false}});
$("logoutButton").addEventListener("click",async()=>{await client.auth.signOut();clearInterval(refreshTimer);location.reload()});
client.auth.getSession().then(({data})=>{if(data.session)showApp(data.session.user?.email)});
</script>
</body>
</html>
